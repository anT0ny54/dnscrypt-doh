services:
  doh:
    build:
      context: .
      args:
        TARGETARCH: amd64
    ports:
      - "8080:8080"
    # No environment overrides here: every value previously listed in this
    # block (PORT, GOMAXPROCS, GOGC, GOMEMLIMIT, RATE_LIMIT,
    # RATE_WINDOW_SECONDS, MAX_CONCURRENCY, MAX_CLIENT_IPS,
    # TRUST_PROXY_HEADERS) just restated the image's own baked-in Dockerfile
    # ENV defaults, so it changed nothing and only risked drifting out of
    # sync with the Dockerfile over time. To actually override a default for
    # local testing, uncomment and edit below:
    # environment:
    #   RATE_LIMIT: 20
    restart: unless-stopped
