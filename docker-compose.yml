services:
  doh:
    # TARGETARCH is populated automatically by BuildKit from the build host /
    # --platform; do not hard-code it here or arm64 hosts get an amd64 toolchain.
    build:
      context: .
    # Compose reads PORT from a project-level .env for interpolation, so the
    # published port follows a PORT override (which env_file also passes to the
    # container) instead of silently diverging from it.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # TRUST_PROXY_HEADERS is deliberately NOT listed in an environment: block:
    # an explicit mapping there would take precedence over .env and silently
    # ignore TRUST_PROXY_HEADERS=false for local development. Instead the
    # image's baked-in ENV default ("true") applies — matching the SnapDeploy
    # deployment, whose managed edge terminates TLS and overwrites
    # CF-Connecting-IP / X-Forwarded-For before the gateway sees them — and
    # env_file passes a .env value straight through when you need to override
    # it. If you publish the port directly with no such edge in front, set
    # TRUST_PROXY_HEADERS=false in .env: trusting spoofable headers in that
    # setup would let any client bypass the per-IP rate limit.
    # Optional local overrides (copy .env.example to .env). The "required: true"
    # env_file syntax needs Docker Compose 2.24 or newer.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
