services:
  doh:
    # TARGETARCH is populated automatically by BuildKit from the build host /
    # --platform; do not hard-code it here or arm64 hosts get an amd64 toolchain.
    build:
      context: .
    # Compose reads PORT from a project-level .env for interpolation, so the
    # published port follows a PORT override (which env_file also passes to the
    # container) instead of silently diverging from it.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Optional local overrides (copy .env.example to .env). The "required: false"
    # env_file syntax needs Docker Compose 2.24 or newer.
    env_file:
      - path: .env
        required: false
    # Compose interpolation does not automatically pass shell variables into
    # the container, so these two are passed explicitly:
    # - PORT keeps the listener and the published container port from
    #   diverging when the shell overrides .env.
    # - TRUST_PROXY_HEADERS defaults to false here even though the image
    #   defaults to true for SnapDeploy's managed edge, because Compose
    #   publishes the port directly. Set it to true only when a trusted proxy
    #   overwrites forwarding headers; spoofed headers can bypass per-IP rate
    #   limits on a directly reachable port.
    environment:
      PORT: "${PORT:-8080}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    restart: unless-stopped
